name: release
on:
  push: {tags: ['v*']}
permissions: {contents: read, packages: write}
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      # amd64 and arm64 (Apple silicon, Raspberry Pi, Graviton); the Dockerfile cross-compiles, no emulation
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/cdmx-in/kera:${{ github.ref_name }}
            ghcr.io/cdmx-in/kera:latest
  # The document extractor that deploy/docker-compose.yml runs next to Kera (sidecars/extract), same tags.
  extract-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # unlike the Go image this one has no cross-compile: apt and pip run for arm64 under QEMU emulation (a few minutes)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: sidecars/extract
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cdmx-in/kera-extract:${{ github.ref_name }}
            ghcr.io/cdmx-in/kera-extract:latest
